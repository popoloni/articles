      <text x="49" y="238" transform="rotate(-.3 49 238)" stroke="#20252b" stroke-width=".48" stroke-linejoin="round" paint-order="stroke">engineering</text>
      <text x="47" y="342" transform="rotate(-.35 47 342)" stroke="#20252b" stroke-width=".48" stroke-linejoin="round" paint-order="stroke">2 · Spec-driven</text>
