<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="528" viewBox="0 0 1000 528" role="img" aria-labelledby="esa-title esa-description">
  <title id="esa-title">Two overlapping confirmations for the same machine</title>
  <desc id="esa-description">Time runs down the page. Request A reads that the machine is free. Request B also reads that it is free. Request A then inserts and commits, followed by request B. Each check was true when read; neither write revalidated it before commit.</desc>
  <defs><pattern id="crayon-blue" patternUnits="userSpaceOnUse" x="0" y="0" width="1000" height="1000"><image xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="1000" preserveAspectRatio="none" xlink:href="media/blue.png"/></pattern><pattern id="crayon-purple" patternUnits="userSpaceOnUse" x="0" y="0" width="1000" height="1000"><image xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="1000" preserveAspectRatio="none" xlink:href="media/purple.png"/></pattern><pattern id="crayon-yellow" patternUnits="userSpaceOnUse" x="0" y="0" width="1000" height="1000"><image xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="1000" preserveAspectRatio="none" xlink:href="media/yellow.png"/></pattern></defs>
  <rect width="1000" height="528" fill="white"/>
  <g fill="#20252b" font-family="SketchHand" text-anchor="middle">
    <text x="334" y="47" font-size="36" stroke="#20252b" stroke-width=".48" stroke-linejoin="round" paint-order="stroke">Request A</text>
    <text x="756" y="47" font-size="36" stroke="#20252b" stroke-width=".48" stroke-linejoin="round" paint-order="stroke">Request B</text>
  </g>
  <g fill="none" stroke="#20252b" stroke-linecap="round" stroke-linejoin="round">
    <path d="M81 64 Q80.7 117 81.6 173 T81.3 271 Q81.6 330 81 393" stroke-width="2.7"/>
    <path d="M81.2 401 L74.1 383.5 L81.3 388.4 L88.1 383.7 Z" fill="#20252b" stroke-width="1.5"/>
  </g>
  <text x="13" y="236" font-family="SketchHand" font-size="26" fill="#20252b" stroke="#20252b" stroke-width=".48" stroke-linejoin="round" paint-order="stroke">time</text>
  <!-- The light drafting overruns and second pen strokes follow the edges of the original reference. -->
  <g stroke="#20252b" stroke-linejoin="round" stroke-linecap="round" stroke-width="2.8">
    <path d="M147 78.7 Q242 77.7 331 78.5 T518.3 78.7 L518 105.1 L518.8 135.7 Q426 135.1 335.7 136 T146.3 135.1 Q146.7 107 147 78.7Z" fill="url(#crayon-blue)"/>
    <path d="M570.2 153 Q675 154 758 153 T944 152.3 L944.4 183 L943.8 210.2 Q847 209.6 757 210.6 T570.2 210.1 L570.8 183.8 Z" fill="url(#crayon-blue)"/>
    <path d="M146.7 228.6 Q241 228.9 332.6 228.1 T518.3 228.9 L518.8 252.3 L518.2 286.2 Q421 285.5 337.8 286.1 T146.9 285.6 L146.1 251.5 Z" fill="url(#crayon-yellow)"/>
    <path d="M570.9 304.7 Q661.3 304 754 304.6 T943.8 304.8 L943.4 332 L944 361.4 Q850 361.2 753 361.9 T570.5 361.2 L571.1 331 Z" fill="url(#crayon-yellow)"/>
    <path d="M31.7 415.5 Q179 415.1 362 415.9 T683.9 415.8 Q822 415 968.2 415.3 L968.9 460.8 L968.4 511 Q779 511.7 612 511.2 T298 511.7 Q154 511 31.2 511.5 L31.7 464.7Z" fill="url(#crayon-purple)"/>
    <g fill="none" stroke-width="1.05" opacity=".82">
      <path d="M143.6 79.8 Q224 77.8 268.9 79.2 M147 75.9 L146.1 120 M436.6 137.1 L522 135.9"/>
      <path d="M567.1 153.9 Q608 152.3 665.4 153.3 M945.1 149.5 L943.3 180 M822.5 209.9 L946.9 211.2"/>
      <path d="M144.2 228 Q185.6 229.6 240.2 228.3 M517.3 225.5 L518.5 257.5 M144 286.5 L238 285.5"/>
      <path d="M568.2 305.6 L641.1 304.5 M944.6 301.3 L943.2 337.8 M866.9 360.4 L946.9 362"/>
      <path d="M28.6 416.3 Q124.2 414.8 211 416.5 M31.2 412.3 L32 450 M846.1 510.4 L971.3 511.8"/>
    </g>
  </g>
  <g font-family="SketchHand" fill="#20252b" font-size="28">
    <text x="176" y="116" stroke="#20252b" stroke-width=".48" stroke-linejoin="round" paint-order="stroke">1</text>
    <text x="217" y="116" stroke="#20252b" stroke-width=".48" stroke-linejoin="round" paint-order="stroke">reads: machine free</text>
    <text x="600" y="190" stroke="#20252b" stroke-width=".48" stroke-linejoin="round" paint-order="stroke">2</text>
    <text x="640" y="190" stroke="#20252b" stroke-width=".48" stroke-linejoin="round" paint-order="stroke">reads: machine free</text>
    <text x="176" y="266" stroke="#20252b" stroke-width=".48" stroke-linejoin="round" paint-order="stroke">3</text>
    <text x="217" y="266" stroke="#20252b" stroke-width=".48" stroke-linejoin="round" paint-order="stroke">inserts and commits</text>
    <text x="600" y="342" stroke="#20252b" stroke-width=".48" stroke-linejoin="round" paint-order="stroke">4</text>
    <text x="640" y="342" stroke="#20252b" stroke-width=".48" stroke-linejoin="round" paint-order="stroke">inserts and commits</text>
  </g>
  <g font-family="SketchHand" fill="#20252b" text-anchor="middle">
    <text x="500" y="453" font-size="29" stroke="#20252b" stroke-width=".48" stroke-linejoin="round" paint-order="stroke">Two overlapping confirmations for the same machine</text>
    <text x="500" y="489" font-size="23" stroke="#20252b" stroke-width=".48" stroke-linejoin="round" paint-order="stroke">Each check was true when read; neither write revalidated it before commit</text>
  </g>
</svg>
