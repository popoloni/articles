<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
<title id="title">Validate the amount before choosing its queue</title>
<desc id="desc">Treasury BR-001/v1: an amount received as text must be parseable, finite and strictly positive. Invalid amounts are rejected. Positive amounts below EUR 5000 enter the standard queue; equality and greater amounts require human review. Core examples are negative 0.01, zero, 4000, 5000, 5001, malformed text and NaN. The faulty starter sends negative 0.01 to the standard queue because it compares with the threshold before validating.</desc>
<defs>
<pattern id="crayon-blue" patternUnits="userSpaceOnUse" width="1000" height="1000"><image width="1000" height="1000" preserveAspectRatio="none" xlink:href="media/blue.png"/></pattern>
<pattern id="crayon-yellow" patternUnits="userSpaceOnUse" width="1000" height="1000"><image width="1000" height="1000" preserveAspectRatio="none" xlink:href="media/yellow.png"/></pattern>
<pattern id="crayon-purple" patternUnits="userSpaceOnUse" width="1000" height="1000"><image width="1000" height="1000" preserveAspectRatio="none" xlink:href="media/purple.png"/></pattern>
</defs><rect width="1000" height="590" fill="white"/>
